name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - lab2-staging

jobs:
  client-tests:
    name: Client Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Client UI Tests (Vitest)
        run: npm test

      - name: Build frontend
        run: npm run build

  server-tests:
    name: Server Tests & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: toktickit
          POSTGRES_PASSWORD: toktickit
          POSTGRES_DB: toktickit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Migrations & Seed Database
        env:
          DATABASE_URL: postgresql://toktickit:toktickit@localhost:5432/toktickit?schema=public
        run: |
          npx prisma migrate deploy
          npm run prisma:seed

      - name: Run Server API Tests (Supertest)
        env:
          DATABASE_URL: postgresql://toktickit:toktickit@localhost:5432/toktickit?schema=public
        run: npm test

      - name: Build backend
        run: npm run build
